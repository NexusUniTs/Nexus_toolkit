<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEXUS — Vota</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <a class="link-indietro" href="index.html">&larr; INDIETRO</a>
  <div id="app"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.2/Sortable.min.js"></script>
  <script src="config.js"></script>
  <script src="opzioni-voto.js"></script>
  <script>
    const app = document.getElementById("app");
    let sortableInstance = null;

    function mescola(lista) {
      const arr = lista.slice();
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function mostraChiuso() {
      app.innerHTML = `
        <div id="stato">
          <h1>[ CHIUSO ]</h1>
          <p>Il voto non è attivo in questo momento.</p>
        </div>`;
    }

    function mostraGrazie() {
      app.innerHTML = `
        <div id="stato">
          <h1>[ INVIATO ]</h1>
          <p>Il tuo ordine di preferenza è stato registrato.</p>
        </div>`;
    }

    function mostraOpzioni() {
      const opzioni = mescola(OPZIONI_VOTO);
      app.innerHTML = `
        <h1>Vota</h1>
        <p class="istruzioni-voto">Trascina le opzioni per ordinarle: in cima quella che ti convince di più, in fondo quella che ti convince di meno.</p>
        <div class="lista-rank" id="lista-rank">
          ${opzioni.map((op, i) => `
            <div class="rank-item" data-titolo="${op.titolo}">
              <span class="rank-handle" title="Trascina per riordinare">&#8942;&#8942;</span>
              <span class="rank-badge">${i + 1}</span>
              <span class="rank-text">
                <span class="rank-title">${op.titolo}</span>
                <span class="rank-example">${op.progetto}</span>
              </span>
            </div>
          `).join("")}
        </div>
        <button type="button" id="btn-conferma" class="btn-primary">Conferma ordine</button>`;

      const lista = document.getElementById("lista-rank");
      sortableInstance = Sortable.create(lista, {
        animation: 180,
        handle: ".rank-handle",
        ghostClass: "rank-ghost",
        chosenClass: "rank-chosen",
        onSort: rinumera,
      });

      document.getElementById("btn-conferma").addEventListener("click", inviaVoto);
    }

    function rinumera() {
      document.querySelectorAll("#lista-rank .rank-item").forEach((el, i) => {
        el.querySelector(".rank-badge").textContent = i + 1;
      });
    }

    async function inviaVoto() {
      const btn = document.getElementById("btn-conferma");
      btn.disabled = true;
      btn.textContent = "Invio...";
      if (sortableInstance) sortableInstance.option("disabled", true);

      const ordine = Array.from(document.querySelectorAll("#lista-rank .rank-item"))
        .map(el => el.dataset.titolo);

      const payload = { tipo: "voto", ordine };

      try {
        await fetch(CONFIG.SCRIPT_URL, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(payload),
        });
        mostraGrazie();
      } catch (err) {
        alert("Invio non riuscito, controlla la connessione e riprova.");
        btn.disabled = false;
        btn.textContent = "Conferma ordine";
        if (sortableInstance) sortableInstance.option("disabled", false);
      }
    }

    if (!CONFIG.RACCOLTA_APERTA) {
      mostraChiuso();
    } else {
      mostraOpzioni();
    }
  </script>
</body>
</html>

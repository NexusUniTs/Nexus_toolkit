<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXUS // TIMELINE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<script src="config.js"></script>
<style>
:root{
  --bg-hero:#060a1a;
  --bg-card:#101c40;
  --bg-card-2:#0b1530;
  --border-blue:#2c3f7a;
  --border-blue-dim:#1c2a54;
  --accent-cyan:#35e0f0;
  --accent-purple:#8b6cf6;
  --text-primary:#ffffff;
  --text-secondary:#93a5cc;
  --text-dim:#55649a;
  --danger:#ff5470;
  --sidebar-w:260px;
  --row-h:44px;
  --header-h:56px;
  --ruler-h:52px;
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;
  background:
    radial-gradient(ellipse 900px 500px at 15% -10%, rgba(139,108,246,0.10), transparent 60%),
    radial-gradient(ellipse 900px 500px at 100% 0%, rgba(53,224,240,0.08), transparent 60%),
    var(--bg-hero);
  color:var(--text-secondary);
  font-family:'Share Tech Mono', monospace;
  overflow:hidden;
}
h1,h2,h3{font-family:'Orbitron', sans-serif; color:var(--text-primary); margin:0;}
::selection{background:rgba(53,224,240,0.25); color:#fff;}
button{font-family:inherit;}
input,textarea,select{font-family:inherit;}

/* scrollbars */
::-webkit-scrollbar{height:10px; width:10px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--border-blue); border-radius:6px;}
::-webkit-scrollbar-thumb:hover{background:var(--accent-cyan);}

/* ---------- APP SHELL ---------- */
.app{display:flex; flex-direction:column; height:100vh;}

/* ---------- TOP BAR ---------- */
.topbar{
  display:flex; align-items:center; gap:18px;
  padding:0 22px;
  height:var(--header-h);
  border-bottom:1px solid var(--border-blue-dim);
  background:rgba(6,10,26,0.85);
  backdrop-filter:blur(6px);
  flex-shrink:0;
}
.brand{display:flex; align-items:baseline; gap:10px; flex-shrink:0;}
.brand h1{font-weight:900; font-size:1.15rem; letter-spacing:0.06em; text-shadow:0 0 16px rgba(53,224,240,0.35);}
.brand .tag{color:var(--accent-cyan); font-size:0.68rem; letter-spacing:0.18em;}

.view-tabs{display:flex; gap:6px; flex:1; overflow-x:auto; scrollbar-width:none;}
.view-tabs::-webkit-scrollbar{display:none;}
.view-tab{
  border:1px solid transparent;
  background:transparent;
  color:var(--text-dim);
  padding:7px 14px;
  border-radius:4px;
  font-size:0.82rem;
  letter-spacing:0.03em;
  cursor:pointer;
  white-space:nowrap;
  display:flex; align-items:center; gap:8px;
  transition:all .15s;
}
.view-tab .dot{width:7px; height:7px; border-radius:50%; flex-shrink:0;}
.view-tab:hover{color:var(--text-secondary); border-color:var(--border-blue);}
.view-tab.active{
  color:var(--text-primary);
  border-color:var(--accent-cyan);
  background:rgba(53,224,240,0.08);
  box-shadow:0 0 12px rgba(53,224,240,0.15);
}
.view-tab.all-tab.active{border-color:var(--accent-purple); background:rgba(139,108,246,0.1); box-shadow:0 0 12px rgba(139,108,246,0.18);}

.topbar-actions{display:flex; gap:8px; align-items:center; flex-shrink:0;}

.icon-btn{
  border:1px solid var(--border-blue);
  background:rgba(255,255,255,0.02);
  color:var(--text-secondary);
  width:34px; height:34px;
  border-radius:4px;
  cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  transition:all .15s;
  flex-shrink:0;
}
.icon-btn:hover{border-color:var(--accent-cyan); color:var(--accent-cyan); box-shadow:0 0 10px rgba(53,224,240,0.2);}
.icon-btn svg{width:16px; height:16px;}

.btn{
  border:1px solid var(--accent-purple);
  border-radius:4px;
  background:rgba(139,108,246,0.12);
  color:var(--accent-purple);
  padding:8px 14px;
  font-size:0.82rem;
  font-weight:700;
  letter-spacing:0.03em;
  cursor:pointer;
  display:flex; align-items:center; gap:7px;
  transition:all .15s;
  white-space:nowrap;
}
.btn:hover{background:rgba(139,108,246,0.25); box-shadow:0 0 14px rgba(139,108,246,0.3);}
.btn.cyan{border-color:var(--accent-cyan); color:var(--accent-cyan); background:rgba(53,224,240,0.08);}
.btn.cyan:hover{background:rgba(53,224,240,0.18); box-shadow:0 0 14px rgba(53,224,240,0.3);}
.btn.ghost{border-color:var(--border-blue); color:var(--text-secondary); background:transparent;}
.btn.ghost:hover{border-color:var(--text-secondary); color:var(--text-primary); box-shadow:none;}
.btn.danger{border-color:var(--danger); color:var(--danger); background:rgba(255,84,112,0.08);}
.btn.danger:hover{background:rgba(255,84,112,0.18); box-shadow:0 0 14px rgba(255,84,112,0.25);}
.btn:disabled{opacity:0.35; cursor:not-allowed; box-shadow:none;}

/* ---------- SUBBAR ---------- */
.subbar{
  display:flex; align-items:center; gap:14px;
  padding:10px 22px;
  border-bottom:1px solid var(--border-blue-dim);
  flex-shrink:0;
  flex-wrap:wrap;
}
.search-wrap{position:relative; flex:1; min-width:180px; max-width:340px;}
.search-wrap svg{position:absolute; left:10px; top:50%; transform:translateY(-50%); width:14px; height:14px; color:var(--text-dim);}
.search-input{
  width:100%;
  background:rgba(255,255,255,0.03);
  border:1px solid var(--border-blue);
  border-radius:4px;
  padding:8px 10px 8px 30px;
  color:var(--text-primary);
  font-size:0.85rem;
}
.search-input::placeholder{color:var(--text-dim);}
.search-input:focus{outline:none; border-color:var(--accent-cyan);}

.zoom-group{display:flex; gap:2px; border:1px solid var(--border-blue); border-radius:4px; padding:2px; flex-shrink:0;}
.zoom-btn{
  background:transparent; border:none; color:var(--text-dim);
  padding:6px 11px; font-size:0.76rem; letter-spacing:0.04em;
  border-radius:3px; cursor:pointer; transition:all .15s;
}
.zoom-btn:hover{color:var(--text-secondary);}
.zoom-btn.active{background:rgba(53,224,240,0.12); color:var(--accent-cyan);}

.stats{display:flex; gap:16px; margin-left:auto; flex-shrink:0; font-size:0.76rem; color:var(--text-dim); letter-spacing:0.02em;}
.stats b{color:var(--text-primary); font-weight:400;}
.stats .stat-cyan b{color:var(--accent-cyan);}
.stats .stat-purple b{color:var(--accent-purple);}

.sync-indicator{
  display:flex; align-items:center; gap:7px;
  border:1px solid var(--border-blue); border-radius:4px;
  padding:6px 11px; font-size:0.72rem; color:var(--text-dim);
  cursor:pointer; flex-shrink:0; letter-spacing:0.03em; transition:all .15s;
  background:transparent;
}
.sync-indicator:hover{border-color:var(--text-secondary); color:var(--text-secondary);}
.sync-dot{width:7px; height:7px; border-radius:50%; flex-shrink:0; background:var(--text-dim); transition:background .2s;}
.sync-indicator.ok .sync-dot{background:var(--accent-cyan); box-shadow:0 0 6px var(--accent-cyan);}
.sync-indicator.syncing .sync-dot{background:var(--accent-purple); box-shadow:0 0 6px var(--accent-purple); animation:pulse 0.9s ease-in-out infinite;}
.sync-indicator.error .sync-dot{background:var(--danger); box-shadow:0 0 6px var(--danger);}
@keyframes pulse{0%,100%{opacity:1;} 50%{opacity:0.35;}}

/* ---------- GRID VIEWPORT ---------- */
.viewport-wrap{flex:1; overflow:hidden; position:relative;}
.viewport{height:100%; overflow:auto; position:relative;}
.grid-inner{position:relative; min-width:100%;}

.grow{display:flex; min-height:var(--row-h);}
.label-cell{
  position:sticky; left:0; z-index:5;
  width:var(--sidebar-w); flex-shrink:0;
  background:var(--bg-hero);
  border-right:1px solid var(--border-blue-dim);
  border-bottom:1px solid rgba(44,63,122,0.35);
  display:flex; align-items:center;
}
.track-cell{
  position:relative;
  border-bottom:1px solid rgba(44,63,122,0.35);
  flex-shrink:0;
}

/* header row */
.grow.header-row{position:sticky; top:0; z-index:6; height:var(--ruler-h); min-height:var(--ruler-h);}
.header-row .label-cell{
  z-index:8; height:var(--ruler-h);
  border-bottom:1px solid var(--border-blue);
  background:var(--bg-hero);
  padding:0 14px;
  justify-content:space-between;
}
.header-row .track-cell{
  height:var(--ruler-h);
  background:var(--bg-hero);
  border-bottom:1px solid var(--border-blue);
  overflow:hidden;
}
.corner-label{font-size:0.68rem; letter-spacing:0.14em; color:var(--text-dim);}
.month-seg{
  position:absolute; top:0; height:100%;
  border-left:1px solid var(--border-blue-dim);
  display:flex; flex-direction:column; justify-content:center;
  padding-left:8px;
  font-size:0.72rem; color:var(--text-secondary);
  letter-spacing:0.03em;
  white-space:nowrap;
}
.month-seg .yr{color:var(--text-dim); font-size:0.62rem;}
.week-tick{position:absolute; top:calc(var(--ruler-h) * 0.55); bottom:0; width:0; border-left:1px dashed rgba(44,63,122,0.4);}
.day-tick{position:absolute; top:0; bottom:0; width:0; border-left:1px solid rgba(255,255,255,0.02);}

/* project group row */
.grow.project-row .label-cell{padding-left:12px; gap:8px; cursor:pointer; user-select:none;}
.grow.project-row .track-cell{background:rgba(255,255,255,0.008);}
.proj-swatch{width:10px; height:10px; border-radius:3px; flex-shrink:0; box-shadow:0 0 8px currentColor;}
.proj-name{color:var(--text-primary); font-size:0.86rem; letter-spacing:0.02em; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:700;}
.proj-count{color:var(--text-dim); font-size:0.7rem; flex-shrink:0;}
.collapse-caret{color:var(--text-dim); font-size:0.65rem; margin-right:2px; transition:transform .15s; flex-shrink:0;}
.collapse-caret.open{transform:rotate(90deg);}
.proj-add-btn{
  margin-left:auto; width:22px; height:22px; border-radius:3px;
  border:1px solid var(--border-blue); background:transparent; color:var(--text-dim);
  display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0;
  opacity:0; transition:all .15s;
}
.grow.project-row:hover .proj-add-btn{opacity:1;}
.proj-add-btn:hover{border-color:var(--accent-cyan); color:var(--accent-cyan);}
.proj-edit-btn{
  width:22px; height:22px; border-radius:3px; flex-shrink:0;
  border:1px solid transparent; background:transparent; color:var(--text-dim);
  display:flex; align-items:center; justify-content:center; cursor:pointer;
  opacity:0; transition:all .15s;
}
.grow.project-row:hover .proj-edit-btn{opacity:1;}
.proj-edit-btn:hover{color:var(--accent-purple);}
.group-range-bar{
  position:absolute; top:50%; transform:translateY(-50%);
  height:5px; border-radius:3px; opacity:0.35;
}

/* phase row */
.grow.phase-row .label-cell{padding-left:34px; gap:8px;}
.phase-name{color:var(--text-secondary); font-size:0.8rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.grow.phase-row:hover .track-cell{background:rgba(255,255,255,0.012);}
.grow.phase-row.dimmed .label-cell,.grow.phase-row.dimmed .track-cell{opacity:0.25;}
.milestone-diamond-label{width:9px; height:9px; transform:rotate(45deg); flex-shrink:0; box-shadow:0 0 6px currentColor;}

/* today line */
.today-line{
  position:absolute; top:0; bottom:0; width:0;
  border-left:1px solid var(--accent-cyan);
  box-shadow:0 0 8px rgba(53,224,240,0.5);
  z-index:4; pointer-events:none;
}
.today-flag{
  position:absolute; top:2px; transform:translateX(-50%);
  font-size:0.6rem; letter-spacing:0.08em; color:var(--bg-hero);
  background:var(--accent-cyan); padding:2px 5px; border-radius:2px;
  white-space:nowrap; z-index:7; box-shadow:0 0 8px rgba(53,224,240,0.4);
}

/* bar */
.bar{
  position:absolute; top:50%; transform:translateY(-50%);
  height:26px; border-radius:5px;
  border:1px solid;
  display:flex; align-items:center;
  cursor:grab; overflow:hidden;
  user-select:none;
  transition:box-shadow .15s, opacity .15s;
}
.bar:hover{box-shadow:0 0 14px currentColor;}
.bar.dragging{cursor:grabbing; box-shadow:0 0 18px currentColor; z-index:9; opacity:0.92;}
.bar .bar-label{
  position:relative; z-index:1; padding:0 9px; font-size:0.74rem; color:var(--text-primary);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; letter-spacing:0.01em;
  pointer-events:none;
  text-shadow:0 1px 2px rgba(0,0,0,0.6);
}
.bar .handle{
  position:absolute; top:0; bottom:0; width:8px; cursor:ew-resize; z-index:2;
}
.bar .handle.left{left:0;}
.bar .handle.right{right:0;}
.bar.selected{box-shadow:0 0 0 2px #fff, 0 0 16px currentColor;}
.bar.too-narrow .bar-label{display:none;}

.milestone{
  position:absolute; top:50%; width:16px; height:16px;
  transform:translate(-50%,-50%) rotate(45deg);
  border:1px solid; cursor:grab;
}
.milestone:hover{box-shadow:0 0 12px currentColor;}
.milestone.selected{box-shadow:0 0 0 2px #fff, 0 0 14px currentColor;}

/* empty state */
.empty-state{
  position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:14px; text-align:center; padding:20px;
}
.empty-state .glyph{font-size:2.2rem; opacity:0.5;}
.empty-state h2{font-size:1rem; letter-spacing:0.05em; color:var(--text-secondary); font-family:'Share Tech Mono',monospace; font-weight:400;}
.empty-state p{font-size:0.8rem; color:var(--text-dim); max-width:320px; margin:0;}

/* ---------- MODALS ---------- */
.overlay{
  position:fixed; inset:0; background:rgba(3,5,14,0.72); backdrop-filter:blur(3px);
  display:flex; align-items:center; justify-content:center; z-index:50;
  padding:20px;
  animation:fadeIn .12s ease-out;
}
@keyframes fadeIn{from{opacity:0;} to{opacity:1;}}
.modal{
  width:100%; max-width:420px;
  background:var(--bg-card);
  border:1px solid var(--border-blue);
  border-left:3px solid var(--accent-cyan);
  border-radius:6px;
  padding:24px;
  max-height:88vh; overflow-y:auto;
  box-shadow:0 20px 60px rgba(0,0,0,0.5);
}
.modal.purple{border-left-color:var(--accent-purple);}
.modal-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:18px;}
.modal-head h2{font-size:1.05rem; letter-spacing:0.03em; text-shadow:0 0 14px rgba(53,224,240,0.3);}
.modal-close{background:none; border:none; color:var(--text-dim); cursor:pointer; font-size:1.1rem; padding:4px;}
.modal-close:hover{color:var(--text-primary);}

.field{margin-top:16px;}
.field label{display:block; margin-bottom:6px; color:var(--text-secondary); font-size:0.82rem;}
.field label::before{content:"> "; color:var(--accent-cyan);}
.field input[type=text],.field textarea,.field input[type=date],.field input[type=number]{
  width:100%; padding:10px 11px; background:rgba(255,255,255,0.03);
  border:1px solid var(--border-blue); border-radius:4px; color:var(--text-primary); font-size:0.9rem;
}
.field input::placeholder,.field textarea::placeholder{color:var(--text-dim);}
.field input:focus,.field textarea:focus,.field input[type=date]:focus{outline:none; border-color:var(--accent-cyan);}
.field textarea{min-height:70px; resize:vertical;}
.field-row{display:flex; gap:12px;}
.field-row .field{flex:1;}
.hint{font-size:0.7rem; color:var(--text-dim); margin-top:5px;}

.swatches{display:flex; gap:8px; flex-wrap:wrap; margin-top:6px;}
.swatch{
  width:26px; height:26px; border-radius:50%; cursor:pointer;
  border:2px solid transparent; position:relative; flex-shrink:0;
}
.swatch.active{border-color:#fff; box-shadow:0 0 10px currentColor;}

.toggle-row{display:flex; align-items:center; justify-content:space-between; margin-top:16px; padding:10px 12px; border:1px solid var(--border-blue-dim); border-radius:4px;}
.toggle-row span{font-size:0.82rem; color:var(--text-secondary);}
.switch{width:38px; height:20px; border-radius:10px; background:var(--border-blue); position:relative; cursor:pointer; flex-shrink:0; transition:background .15s;}
.switch.on{background:var(--accent-purple);}
.switch::after{content:""; position:absolute; top:2px; left:2px; width:16px; height:16px; border-radius:50%; background:#fff; transition:left .15s;}
.switch.on::after{left:20px;}

.modal-actions{display:flex; gap:10px; margin-top:24px;}
.modal-actions .btn{flex:1; justify-content:center; padding:11px;}
.modal-actions .btn.icon-only{flex:0 0 auto; padding:11px 13px;}

/* project select in phase modal */
.proj-pick{display:flex; flex-direction:column; gap:6px; margin-top:6px; max-height:160px; overflow-y:auto;}
.proj-pick-opt{
  display:flex; align-items:center; gap:9px; padding:9px 11px;
  border:1px solid var(--border-blue-dim); border-radius:4px; cursor:pointer; transition:all .15s;
}
.proj-pick-opt:hover{border-color:var(--border-blue);}
.proj-pick-opt.active{border-color:var(--accent-cyan); background:rgba(53,224,240,0.06);}
.proj-pick-opt .proj-swatch{width:9px; height:9px;}
.proj-pick-opt span{font-size:0.82rem; color:var(--text-secondary);}
.proj-pick-opt.active span{color:var(--text-primary);}

/* confirm modal */
.modal.confirm{max-width:340px; border-left-color:var(--danger);}
.modal.confirm p{font-size:0.85rem; line-height:1.5; color:var(--text-secondary);}

/* toast */
.toast{
  position:fixed; bottom:22px; left:50%; transform:translateX(-50%) translateY(0);
  background:var(--bg-card); border:1px solid var(--accent-cyan); border-radius:5px;
  padding:11px 18px; font-size:0.8rem; color:var(--text-primary); z-index:80;
  box-shadow:0 0 20px rgba(53,224,240,0.25);
  display:flex; align-items:center; gap:8px;
  opacity:0; pointer-events:none; transition:opacity .2s, transform .2s;
}
.toast.show{opacity:1; transform:translateX(-50%) translateY(-6px);}
.toast .t-dot{width:6px; height:6px; border-radius:50%; background:var(--accent-cyan); box-shadow:0 0 6px var(--accent-cyan);}

/* tooltip on drag */
.drag-tip{
  position:absolute; bottom:calc(100% + 6px); left:50%; transform:translateX(-50%);
  background:var(--bg-hero); border:1px solid var(--accent-cyan); border-radius:3px;
  padding:3px 8px; font-size:0.68rem; color:var(--accent-cyan); white-space:nowrap; z-index:20;
  pointer-events:none;
}

.loading-wrap{position:fixed; inset:0; display:flex; align-items:center; justify-content:center; background:var(--bg-hero); z-index:100; flex-direction:column; gap:14px;}
.loading-wrap .spin{width:34px; height:34px; border-radius:50%; border:2px solid var(--border-blue); border-top-color:var(--accent-cyan); animation:spin 0.8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.loading-wrap p{font-size:0.78rem; letter-spacing:0.1em; color:var(--text-dim);}

@media (max-width:900px){
  #linkFileLabel{display:none;}
}
@media (max-width:720px){
  :root{--sidebar-w:170px;}
  .brand .tag{display:none;}
  .stats{display:none;}
}
</style>
</head>
<body>

<div class="loading-wrap" id="loadingWrap">
  <div class="spin"></div>
  <p>[ SINCRONIZZAZIONE TIMELINE ]</p>
</div>

<div class="app" id="app" style="display:none;">

  <div class="topbar">
    <div class="brand">
      <h1>NEXUS // TIMELINE</h1>
      <span class="tag">[ PIANIFICAZIONE PROGETTI ]</span>
    </div>
    <div class="view-tabs" id="viewTabs"></div>
    <div class="topbar-actions">
      <button class="icon-btn" id="exportBtn" title="Esporta backup JSON">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      </button>
      <button class="icon-btn" id="importBtn" title="Importa backup JSON">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
      </button>
      <input type="file" id="importFile" accept="application/json" style="display:none;">
      <button class="btn ghost" id="linkFileBtn" title="Collega file JSON locale">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
        <span id="linkFileLabel">FILE LOCALE</span>
      </button>
      <button class="btn cyan" id="newPhaseBtn">+ FASE</button>
      <button class="btn cyan" id="newProjectBtn">+ PROGETTO</button>
    </div>
  </div>

  <div class="subbar">
    <div class="search-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input class="search-input" id="searchInput" placeholder="Cerca una fase...">
    </div>
    <div class="zoom-group" id="zoomGroup">
      <button class="zoom-btn" data-zoom="week">SETTIMANA</button>
      <button class="zoom-btn" data-zoom="month">MESE</button>
      <button class="zoom-btn" data-zoom="quarter">TRIMESTRE</button>
    </div>
    <button class="btn ghost" id="todayBtn">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><line x1="12" y1="12" x2="12" y2="7"/><line x1="12" y1="12" x2="15.5" y2="14"/></svg>
      OGGI
    </button>
    <button class="sync-indicator" id="syncIndicator" title="Clic per sincronizzare ora">
      <span class="sync-dot"></span>
      <span id="syncLabel">non collegato</span>
    </button>
    <div class="stats" id="statsBar"></div>
  </div>

  <div class="viewport-wrap">
    <div class="viewport" id="viewport">
      <div class="grid-inner" id="gridInner"></div>
    </div>
    <div class="empty-state" id="emptyState" style="display:none;">
      <div class="glyph">◇</div>
      <h2>[ NESSUN PROGETTO ANCORA ]</h2>
      <p>Crea il tuo primo progetto per iniziare a costruire la timeline. Ogni progetto puo&#768; contenere piu&#768; fasi posizionabili liberamente nel tempo.</p>
      <button class="btn cyan" id="emptyNewProjectBtn">+ CREA PROGETTO</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"><span class="t-dot"></span><span id="toastText"></span></div>

<script>
(function(){
"use strict";

/* ===================== CONFIG ===================== */
const PALETTE = [
  {name:'cyan',   hex:'#35e0f0'},
  {name:'purple', hex:'#8b6cf6'},
  {name:'pink',   hex:'#ff5fa2'},
  {name:'amber',  hex:'#ffb84d'},
  {name:'lime',   hex:'#8dff6b'},
  {name:'coral',  hex:'#ff7a5c'},
  {name:'blue',   hex:'#5b8dff'},
  {name:'mint',   hex:'#4de8c4'}
];
const ZOOM_LEVELS = { week:38, month:11, quarter:4.2 };
const DAY_MS = 86400000;
const STORAGE_KEY = 'nexus-timeline-data-v1';

/* ===================== STATE ===================== */
let state = {
  projects: [],
  phases: [],
  currentView: 'all',      // 'all' | projectId
  zoom: 'month',
  collapsed: {},           // projectId -> bool
  search: '',
  selectedId: null,        // selected phase id (bar highlighted)
};

let editingProject = null;   // project object being edited in modal, or null = new
let editingPhase = null;     // phase object being edited, or null = new
let pendingDeleteType = null;
let pendingDeleteId = null;

/* ===================== PERSISTENCE ===================== */
/* I dati sono condivisi tra tutti tramite lo stesso Google Apps Script
   usato per commenti e voti (vedi config.js -> CONFIG.SCRIPT_URL).
   Il localStorage viene usato solo come copia di riserva offline. */
const REMOTE_URL = (typeof CONFIG !== 'undefined' && CONFIG.SCRIPT_URL) ? CONFIG.SCRIPT_URL : null;
const POLL_MS = 12000;
let lastPushAt = 0;
let pollTimer = null;

function setSyncStatus(mode, label){
  const el = document.getElementById('syncIndicator');
  const lbl = document.getElementById('syncLabel');
  if(!el || !lbl) return;
  el.classList.remove('ok','syncing','error');
  if(mode) el.classList.add(mode);
  lbl.textContent = label;
}

async function fetchRemote(){
  if(!REMOTE_URL) return null;
  const res = await fetch(REMOTE_URL + '?action=getTimeline', {method:'GET'});
  if(!res.ok) throw new Error('HTTP '+res.status);
  const json = await res.json();
  if(json && Array.isArray(json.projects)) return json;
  return null;
}

async function pushRemote(payload){
  if(!REMOTE_URL) return;
  await fetch(REMOTE_URL, {
    method: 'POST',
    mode: 'no-cors',
    headers: {'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify({tipo:'timeline', payload})
  });
  // con "no-cors" non possiamo leggere la risposta: assumiamo l'invio andato a buon fine.
}

async function loadData(){
  if(!REMOTE_URL){
    setSyncStatus('error', 'backend non configurato');
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      if(raw){ const parsed = JSON.parse(raw); if(parsed && Array.isArray(parsed.projects)) return parsed; }
    }catch(e){}
    return null;
  }
  setSyncStatus('syncing', 'sincronizzazione...');
  try{
    const remote = await fetchRemote();
    if(remote){
      try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(remote)); }catch(e){}
      setSyncStatus('ok', 'sincronizzato '+nowHM());
      return remote;
    }
  }catch(e){
    console.error('Caricamento da Google Sheets fallito', e);
  }
  // fallback: copia locale se il backend non e' raggiungibile
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      if(parsed && Array.isArray(parsed.projects)){
        setSyncStatus('error', 'offline, copia locale');
        showToast('Backend non raggiungibile: uso l\u2019ultima copia salvata su questo browser');
        return parsed;
      }
    }
  }catch(e){}
  setSyncStatus('error', 'non raggiungibile');
  return null;
}

let saveTimer = null;
function scheduleSave(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveData, 200);
}
async function saveData(){
  const payload = {
    projects: state.projects,
    phases: state.phases,
    collapsed: state.collapsed,
    zoom: state.zoom
  };
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(payload)); }catch(e){}

  if(REMOTE_URL){
    setSyncStatus('syncing', 'invio...');
    try{
      await pushRemote(payload);
      lastPushAt = Date.now();
      setSyncStatus('ok', 'sincronizzato '+nowHM());
    }catch(e){
      console.error('Invio a Google Sheets fallito', e);
      setSyncStatus('error', 'invio non riuscito');
      showToast('Sincronizzazione non riuscita, controlla la connessione');
    }
  }

  if(fileHandle){
    try{
      const writable = await fileHandle.createWritable();
      await writable.write(JSON.stringify({projects:state.projects, phases:state.phases, exportedAt:new Date().toISOString()}, null, 2));
      await writable.close();
      setLinkedLabel(fileHandle.name, true);
    }catch(e){
      console.error('Scrittura su file locale fallita', e);
      showToast('Scrittura sul file locale non riuscita');
      setLinkedLabel(fileHandle.name, false);
    }
  }
}

function nowHM(){
  const d = new Date();
  return pad2(d.getHours())+':'+pad2(d.getMinutes());
}

/* Sincronizzazione periodica: tiene la timeline allineata a quello che
   scrivono eventuali altre persone collegate nello stesso momento. Si
   ferma quando c'e' un modal aperto o subito dopo un nostro salvataggio,
   per non interrompere una modifica in corso o creare "sfarfallii". */
async function pollRemote(){
  if(!REMOTE_URL) return;
  if(document.querySelector('.overlay')) return;
  if(Date.now() - lastPushAt < 4000) return;
  try{
    const remote = await fetchRemote();
    if(remote){
      const incoming = JSON.stringify({projects:remote.projects, phases:remote.phases});
      const current = JSON.stringify({projects:state.projects, phases:state.phases});
      if(incoming !== current){
        state.projects = remote.projects || [];
        state.phases = remote.phases || [];
        try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(remote)); }catch(e){}
        render();
      }
      setSyncStatus('ok', 'sincronizzato '+nowHM());
    }
  }catch(e){
    setSyncStatus('error', 'connessione persa');
  }
}
function startPolling(){
  clearInterval(pollTimer);
  pollTimer = setInterval(pollRemote, POLL_MS);
}

/* ---- optional: keep a live JSON file on disk in sync (Chromium browsers) ---- */
let fileHandle = null;
function setLinkedLabel(name, ok){
  const lbl = document.getElementById('linkFileLabel');
  const btn = document.getElementById('linkFileBtn');
  if(!lbl || !btn) return;
  if(!fileHandle){
    lbl.textContent = 'FILE LOCALE';
    btn.classList.remove('cyan'); btn.title = 'Collega un file JSON locale che si aggiorna a ogni modifica';
    return;
  }
  lbl.textContent = ok===false ? (name+' \u26A0') : name;
  btn.classList.add('cyan');
  btn.title = 'Collegato a '+name+' \u2014 clic per scollegare';
}
async function toggleFileLink(){
  if(fileHandle){
    fileHandle = null;
    setLinkedLabel(null);
    showToast('File locale scollegato');
    return;
  }
  if(!window.showSaveFilePicker){
    showToast('Il browser non supporta il collegamento diretto a un file. Usa Esporta / Importa JSON.');
    return;
  }
  try{
    fileHandle = await window.showSaveFilePicker({
      suggestedName: 'nexus-timeline.json',
      types: [{description:'JSON', accept:{'application/json':['.json']}}]
    });
    setLinkedLabel(fileHandle.name, true);
    showToast('File collegato: ogni modifica verra\u0300 scritta qui');
    await saveData();
  }catch(e){
    if(e && e.name !== 'AbortError'){
      console.error(e);
      showToast('Impossibile collegare il file in questo ambiente. Usa Esporta / Importa JSON.');
    }
    fileHandle = null;
  }
}

/* ===================== UTIL ===================== */
function uid(){ return Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4); }
function pad2(n){ return n<10 ? '0'+n : ''+n; }
function toISO(d){ return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
function fromISO(s){ const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); }
function addDays(d, n){ const r = new Date(d); r.setDate(r.getDate()+n); return r; }
function daysBetween(a,b){ return Math.round((strip(b) - strip(a)) / DAY_MS); }
function strip(d){ return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
function todayISO(){ return toISO(new Date()); }
const MONTHS_IT = ['GEN','FEB','MAR','APR','MAG','GIU','LUG','AGO','SET','OTT','NOV','DIC'];
const MONTHS_IT_FULL = ['Gennaio','Febbraio','Marzo','Aprile','Maggio','Giugno','Luglio','Agosto','Settembre','Ottobre','Novembre','Dicembre'];

function projectById(id){ return state.projects.find(p=>p.id===id); }
function phasesOf(projectId){ return state.phases.filter(ph=>ph.projectId===projectId); }
function hexAlpha(hex, alpha){
  const a = Math.round(alpha*255).toString(16).padStart(2,'0');
  return hex.length===7 ? hex+a : hex;
}
function colorFor(phase){
  if(phase.color) return phase.color;
  const proj = projectById(phase.projectId);
  return proj ? proj.color : PALETTE[0].hex;
}

function showToast(msg){
  const t = document.getElementById('toast');
  document.getElementById('toastText').textContent = msg;
  t.classList.add('show');
  clearTimeout(showToast._timer);
  showToast._timer = setTimeout(()=>t.classList.remove('show'), 2200);
}

/* ===================== SEED (first run only) ===================== */
function seedIfEmpty(){
  if(state.projects.length) return;
  const today = new Date();
  const p1 = {id:uid(), name:'Lancio piattaforma NEXUS', color:PALETTE[0].hex, notes:'Rilascio pubblico della web app'};
  const p2 = {id:uid(), name:'Campagna marketing Q4', color:PALETTE[2].hex, notes:''};
  state.projects.push(p1, p2);
  state.phases.push(
    {id:uid(), projectId:p1.id, name:'Ricerca & scoping', start:toISO(addDays(today,-18)), end:toISO(addDays(today,-4)), color:'', milestone:false, notes:''},
    {id:uid(), projectId:p1.id, name:'Sviluppo core', start:toISO(addDays(today,-4)), end:toISO(addDays(today,24)), color:'', milestone:false, notes:''},
    {id:uid(), projectId:p1.id, name:'Beta chiusa', start:toISO(addDays(today,24)), end:toISO(addDays(today,38)), color:'', milestone:false, notes:''},
    {id:uid(), projectId:p1.id, name:'Go live', start:toISO(addDays(today,42)), end:toISO(addDays(today,42)), color:'', milestone:true, notes:''},
    {id:uid(), projectId:p2.id, name:'Creativita\u0300 & asset', start:toISO(addDays(today,2)), end:toISO(addDays(today,20)), color:'', milestone:false, notes:''},
    {id:uid(), projectId:p2.id, name:'Flight campagna', start:toISO(addDays(today,20)), end:toISO(addDays(today,60)), color:'', milestone:false, notes:''}
  );
}

/* ===================== VIEW TABS ===================== */
function renderTabs(){
  const wrap = document.getElementById('viewTabs');
  wrap.innerHTML = '';
  const allTab = document.createElement('button');
  allTab.className = 'view-tab all-tab' + (state.currentView==='all' ? ' active' : '');
  allTab.innerHTML = '<span class="dot" style="background:var(--accent-purple); box-shadow:0 0 6px var(--accent-purple);"></span>TUTTI I PROGETTI';
  allTab.onclick = ()=>{ state.currentView='all'; render(); };
  wrap.appendChild(allTab);

  state.projects.forEach(p=>{
    const tab = document.createElement('button');
    tab.className = 'view-tab' + (state.currentView===p.id ? ' active' : '');
    tab.innerHTML = '<span class="dot" style="background:'+p.color+'; box-shadow:0 0 6px '+p.color+';"></span>'+escapeHtml(p.name);
    tab.onclick = ()=>{ state.currentView=p.id; render(); };
    wrap.appendChild(tab);
  });
}

function escapeHtml(s){
  const d = document.createElement('div');
  d.textContent = s==null ? '' : s;
  return d.innerHTML;
}

/* ===================== STATS ===================== */
function renderStats(){
  const bar = document.getElementById('statsBar');
  const projCount = state.projects.length;
  const relevantPhases = state.currentView==='all' ? state.phases : phasesOf(state.currentView);
  const phaseCount = relevantPhases.filter(ph=>!ph.milestone).length;
  const milestoneCount = relevantPhases.filter(ph=>ph.milestone).length;
  bar.innerHTML =
    '<span class="stat-cyan">PROGETTI <b>'+projCount+'</b></span>'+
    '<span>FASI <b>'+phaseCount+'</b></span>'+
    '<span class="stat-purple">TRAGUARDI <b>'+milestoneCount+'</b></span>';
}

/* ===================== ROW MODEL ===================== */
function buildRows(){
  const rows = [];
  const search = state.search.trim().toLowerCase();
  if(state.currentView === 'all'){
    state.projects.forEach(proj=>{
      let phs = phasesOf(proj.id).slice().sort((a,b)=> a.start.localeCompare(b.start));
      let matchCount = 0;
      if(search){ matchCount = phs.filter(ph=>ph.name.toLowerCase().includes(search)).length; }
      rows.push({type:'project', project:proj, phaseCount:phs.length});
      if(!state.collapsed[proj.id]){
        phs.forEach(ph=>{
          const dim = !!(search && !ph.name.toLowerCase().includes(search));
          rows.push({type:'phase', phase:ph, project:proj, dim});
        });
      }
    });
  } else {
    const proj = projectById(state.currentView);
    if(proj){
      let phs = phasesOf(proj.id).slice().sort((a,b)=> a.start.localeCompare(b.start));
      phs.forEach(ph=>{
        const dim = !!(search && !ph.name.toLowerCase().includes(search));
        rows.push({type:'phase', phase:ph, project:proj, dim});
      });
    }
  }
  return rows;
}

/* ===================== TIMELINE RANGE ===================== */
function computeRange(){
  const relevant = state.currentView==='all' ? state.phases : phasesOf(state.currentView);
  const today = strip(new Date());
  let min = addDays(today, -14);
  let max = addDays(today, 60);
  if(relevant.length){
    relevant.forEach(ph=>{
      const s = fromISO(ph.start), e = fromISO(ph.end);
      if(s < min) min = s;
      if(e > max) max = e;
    });
    min = addDays(min, -10);
    max = addDays(max, 14);
  }
  return {start:strip(min), end:strip(max)};
}

/* ===================== RENDER TIMELINE GRID ===================== */
let pxPerDay = ZOOM_LEVELS.month;

function render(){
  renderTabs();
  renderStats();
  document.querySelectorAll('.zoom-btn').forEach(b=>{
    b.classList.toggle('active', b.dataset.zoom === state.zoom);
  });
  pxPerDay = ZOOM_LEVELS[state.zoom];

  const emptyState = document.getElementById('emptyState');
  const viewportWrap = document.getElementById('viewport');
  if(state.projects.length === 0){
    emptyState.style.display = 'flex';
    viewportWrap.style.display = 'none';
    return;
  }
  emptyState.style.display = 'none';
  viewportWrap.style.display = 'block';

  const range = computeRange();
  const totalDays = Math.max(1, daysBetween(range.start, range.end));
  const timelineWidth = Math.round(totalDays * pxPerDay);
  const rows = buildRows();

  const inner = document.getElementById('gridInner');
  inner.innerHTML = '';
  inner.style.width = (parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--sidebar-w')) + timelineWidth) + 'px';

  // ---- header row ----
  const headerRow = document.createElement('div');
  headerRow.className = 'grow header-row';
  const headerLabel = document.createElement('div');
  headerLabel.className = 'label-cell';
  headerLabel.innerHTML = '<span class="corner-label">'+ (state.currentView==='all' ? 'TUTTI I PROGETTI' : escapeHtml(projectById(state.currentView)?.name||'')) +'</span>';
  const headerTrack = document.createElement('div');
  headerTrack.className = 'track-cell';
  headerTrack.style.width = timelineWidth+'px';

  // month segments
  let cursor = new Date(range.start.getFullYear(), range.start.getMonth(), 1);
  while(cursor <= range.end){
    const segStart = cursor < range.start ? range.start : cursor;
    const nextMonth = new Date(cursor.getFullYear(), cursor.getMonth()+1, 1);
    const segEnd = nextMonth < range.end ? nextMonth : addDays(range.end,1);
    const left = daysBetween(range.start, segStart) * pxPerDay;
    const width = daysBetween(segStart, segEnd) * pxPerDay;
    const seg = document.createElement('div');
    seg.className = 'month-seg';
    seg.style.left = left+'px';
    seg.style.width = width+'px';
    seg.innerHTML = '<span>'+MONTHS_IT[cursor.getMonth()]+'</span><span class="yr">'+cursor.getFullYear()+'</span>';
    headerTrack.appendChild(seg);
    cursor = nextMonth;
  }
  // week ticks when zoomed enough
  if(state.zoom !== 'quarter'){
    let wd = new Date(range.start);
    while(wd.getDay() !== 1){ wd = addDays(wd,1); }
    while(wd <= range.end){
      const left = daysBetween(range.start, wd) * pxPerDay;
      const tick = document.createElement('div');
      tick.className = 'week-tick';
      tick.style.left = left+'px';
      headerTrack.appendChild(tick);
      wd = addDays(wd,7);
    }
  }
  headerRow.appendChild(headerLabel);
  headerRow.appendChild(headerTrack);
  inner.appendChild(headerRow);

  // ---- body rows ----
  rows.forEach(row=>{
    const grow = document.createElement('div');
    const label = document.createElement('div');
    label.className = 'label-cell';
    const track = document.createElement('div');
    track.className = 'track-cell';
    track.style.width = timelineWidth+'px';

    if(row.type === 'project'){
      grow.className = 'grow project-row';
      const collapsedState = !!state.collapsed[row.project.id];
      label.innerHTML =
        '<span class="collapse-caret'+(collapsedState?'':' open')+'">\u25B8</span>'+
        '<span class="proj-swatch" style="background:'+row.project.color+'; color:'+row.project.color+';"></span>'+
        '<span class="proj-name">'+escapeHtml(row.project.name)+'</span>'+
        '<span class="proj-count">'+row.phaseCount+'</span>';
      const editBtn = document.createElement('button');
      editBtn.className = 'proj-edit-btn';
      editBtn.title = 'Modifica progetto';
      editBtn.innerHTML = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></svg>';
      editBtn.onclick = (e)=>{ e.stopPropagation(); openProjectModal(row.project); };
      const addBtn = document.createElement('button');
      addBtn.className = 'proj-add-btn';
      addBtn.title = 'Aggiungi fase';
      addBtn.textContent = '+';
      addBtn.onclick = (e)=>{ e.stopPropagation(); openPhaseModal(null, row.project.id); };
      label.appendChild(editBtn);
      label.appendChild(addBtn);
      label.onclick = ()=>{ state.collapsed[row.project.id] = !collapsedState; scheduleSave(); render(); };

      // group range indicator bar
      const phs = phasesOf(row.project.id);
      if(phs.length){
        let gs = fromISO(phs[0].start), ge = fromISO(phs[0].end);
        phs.forEach(ph=>{ const s=fromISO(ph.start), e=fromISO(ph.end); if(s<gs)gs=s; if(e>ge)ge=e; });
        const left = daysBetween(range.start, gs) * pxPerDay;
        const width = Math.max(4, daysBetween(gs, addDays(ge,1)) * pxPerDay);
        const bar = document.createElement('div');
        bar.className = 'group-range-bar';
        bar.style.left = left+'px';
        bar.style.width = width+'px';
        bar.style.background = row.project.color;
        track.appendChild(bar);
      }
      track.ondblclick = (e)=>{
        if(e.target !== track) return;
        const rect = track.getBoundingClientRect();
        const dayOffset = Math.round((e.clientX - rect.left) / pxPerDay);
        const start = addDays(range.start, dayOffset);
        openPhaseModal(null, row.project.id, toISO(start));
      };

    } else {
      grow.className = 'grow phase-row' + (row.dim ? ' dimmed' : '');
      grow.dataset.phaseId = row.phase.id;
      const color = colorFor(row.phase);
      if(row.phase.milestone){
        label.innerHTML = '<span class="milestone-diamond-label" style="background:'+color+'; color:'+color+';"></span><span class="phase-name">'+escapeHtml(row.phase.name)+'</span>';
      } else {
        label.innerHTML = '<span class="phase-name">'+escapeHtml(row.phase.name)+'</span>';
      }
      track.ondblclick = (e)=>{
        if(e.target !== track) return;
        openPhaseModal(row.phase);
      };
      renderBar(track, row.phase, range, color);
    }

    grow.appendChild(label);
    grow.appendChild(track);
    inner.appendChild(grow);
  });

  // today line spanning full height
  const todayOffset = daysBetween(range.start, strip(new Date()));
  if(todayOffset >= 0 && todayOffset <= totalDays){
    const totalHeight = (rows.length+1) * parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--row-h')) + parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--ruler-h'));
    const sidebarW = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--sidebar-w'));
    const line = document.createElement('div');
    line.className = 'today-line';
    line.style.left = (sidebarW + todayOffset*pxPerDay) + 'px';
    line.style.height = totalHeight + 'px';
    const flag = document.createElement('div');
    flag.className = 'today-flag';
    flag.style.left = (sidebarW + todayOffset*pxPerDay) + 'px';
    flag.textContent = 'OGGI';
    inner.appendChild(line);
    inner.appendChild(flag);
  }
}

function renderBar(track, phase, range, color){
  if(phase.milestone){
    const left = daysBetween(range.start, fromISO(phase.start)) * pxPerDay;
    const el = document.createElement('div');
    el.className = 'milestone' + (state.selectedId===phase.id ? ' selected':'');
    el.style.left = left+'px';
    el.style.background = hexAlpha(color, 0.55);
    el.style.borderColor = color;
    el.style.color = color;
    el.title = phase.name+' \u2014 '+phase.start;
    attachDrag(el, phase, range, true, false);
    el.onclick = (e)=>{ if(!el._wasDragged){ state.selectedId = phase.id; openPhaseModal(phase);} };
    track.appendChild(el);
    return;
  }
  const startOffset = daysBetween(range.start, fromISO(phase.start));
  const durDays = Math.max(1, daysBetween(fromISO(phase.start), fromISO(phase.end)) + 1);
  const left = startOffset * pxPerDay;
  const width = Math.max(10, durDays * pxPerDay);

  const el = document.createElement('div');
  el.className = 'bar' + (state.selectedId===phase.id ? ' selected':'') + (width < 46 ? ' too-narrow':'');
  el.style.left = left+'px';
  el.style.width = width+'px';
  el.style.borderColor = color;
  el.style.color = color;
  el.style.background = hexAlpha(color, 0.32);
  el.title = phase.name+' \u2014 '+phase.start+' \u2192 '+phase.end;

  const labelSpan = document.createElement('div');
  labelSpan.className = 'bar-label';
  labelSpan.textContent = phase.name;
  el.appendChild(labelSpan);

  const hL = document.createElement('div'); hL.className='handle left';
  const hR = document.createElement('div'); hR.className='handle right';
  el.appendChild(hL); el.appendChild(hR);

  attachDrag(el, phase, range, false, false, hL, hR);
  el.onclick = (e)=>{ if(!el._wasDragged){ state.selectedId = phase.id; openPhaseModal(phase);} };

  track.appendChild(el);
}

/* ===================== DRAG / RESIZE ===================== */
function attachDrag(el, phase, range, isMilestone, disabled, handleLeft, handleRight){
  let mode = null; // 'move' | 'resize-left' | 'resize-right'
  let startX = 0;
  let origStart, origEnd;
  let moved = false;

  function onDown(mode_){
    return function(e){
      e.preventDefault();
      e.stopPropagation();
      mode = mode_;
      startX = e.clientX;
      origStart = fromISO(phase.start);
      origEnd = fromISO(phase.end);
      moved = false;
      el._wasDragged = false;
      el.classList.add('dragging');
      document.addEventListener('mousemove', onMove);
      document.addEventListener('mouseup', onUp);
    };
  }

  function onMove(e){
    const dx = e.clientX - startX;
    const dayDelta = Math.round(dx / pxPerDay);
    if(dayDelta !== 0) moved = true;
    let newStart = origStart, newEnd = origEnd;
    if(mode === 'move'){
      newStart = addDays(origStart, dayDelta);
      newEnd = addDays(origEnd, dayDelta);
    } else if(mode === 'resize-left'){
      newStart = addDays(origStart, dayDelta);
      if(newStart > origEnd) newStart = origEnd;
    } else if(mode === 'resize-right'){
      newEnd = addDays(origEnd, dayDelta);
      if(newEnd < origStart) newEnd = origStart;
    }
    const left = daysBetween(range.start, newStart) * pxPerDay;
    const durDays = isMilestone ? 0 : Math.max(1, daysBetween(newStart, newEnd)+1);
    el.style.left = left+'px';
    if(!isMilestone) el.style.width = Math.max(10, durDays*pxPerDay)+'px';
    showDragTip(el, newStart, newEnd, isMilestone);
  }

  function onUp(e){
    document.removeEventListener('mousemove', onMove);
    document.removeEventListener('mouseup', onUp);
    el.classList.remove('dragging');
    removeDragTip();
    if(moved){
      const dx = e.clientX - startX;
      const dayDelta = Math.round(dx / pxPerDay);
      let newStart = origStart, newEnd = origEnd;
      if(mode === 'move'){
        newStart = addDays(origStart, dayDelta);
        newEnd = addDays(origEnd, dayDelta);
      } else if(mode === 'resize-left'){
        newStart = addDays(origStart, dayDelta);
        if(newStart > origEnd) newStart = origEnd;
      } else if(mode === 'resize-right'){
        newEnd = addDays(origEnd, dayDelta);
        if(newEnd < origStart) newEnd = origStart;
      }
      phase.start = toISO(newStart);
      phase.end = toISO(isMilestone ? newStart : newEnd);
      scheduleSave();
      el._wasDragged = true;
      render();
      setTimeout(()=>{ el._wasDragged = false; }, 50);
    }
    mode = null;
  }

  el.addEventListener('mousedown', onDown('move'));
  if(handleLeft) handleLeft.addEventListener('mousedown', onDown('resize-left'));
  if(handleRight) handleRight.addEventListener('mousedown', onDown('resize-right'));
}

function showDragTip(el, s, e, isMilestone){
  removeDragTip();
  const tip = document.createElement('div');
  tip.className = 'drag-tip';
  tip.id = 'activeDragTip';
  tip.textContent = isMilestone ? fmtDate(s) : (fmtDate(s)+' \u2192 '+fmtDate(e));
  el.appendChild(tip);
}
function removeDragTip(){
  const existing = document.getElementById('activeDragTip');
  if(existing) existing.remove();
}
function fmtDate(d){ return pad2(d.getDate())+' '+MONTHS_IT[d.getMonth()]; }

/* ===================== PROJECT MODAL ===================== */
function openProjectModal(project){
  editingProject = project || null;
  const isNew = !project;
  const color = project ? project.color : PALETTE[Math.floor(Math.random()*PALETTE.length)].hex;

  const overlay = document.createElement('div');
  overlay.className = 'overlay';
  overlay.innerHTML = `
    <div class="modal purple">
      <div class="modal-head">
        <h2>${isNew ? '+ NUOVO PROGETTO' : 'MODIFICA PROGETTO'}</h2>
        <button class="modal-close" id="closeProjModal">\u2715</button>
      </div>
      <div class="field">
        <label>Nome progetto</label>
        <input type="text" id="projNameInput" placeholder="es. Lancio piattaforma" value="${escapeHtml(project?project.name:'')}">
      </div>
      <div class="field">
        <label>Colore</label>
        <div class="swatches" id="projSwatches"></div>
      </div>
      <div class="field">
        <label>Note (opzionale)</label>
        <textarea id="projNotesInput" placeholder="Descrizione, obiettivi, contesto...">${escapeHtml(project?project.notes||'':'')}</textarea>
      </div>
      <div class="modal-actions">
        ${!isNew ? '<button class="btn danger icon-only" id="deleteProjBtn" title="Elimina progetto"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg></button>' : ''}
        <button class="btn ghost" id="cancelProjBtn">ANNULLA</button>
        <button class="btn cyan" id="saveProjBtn">${isNew ? 'CREA' : 'SALVA'}</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);

  const swWrap = overlay.querySelector('#projSwatches');
  let chosenColor = color;
  PALETTE.forEach(c=>{
    const sw = document.createElement('div');
    sw.className = 'swatch' + (c.hex===chosenColor ? ' active':'');
    sw.style.background = c.hex;
    sw.style.color = c.hex;
    sw.onclick = ()=>{
      chosenColor = c.hex;
      swWrap.querySelectorAll('.swatch').forEach(s=>s.classList.remove('active'));
      sw.classList.add('active');
    };
    swWrap.appendChild(sw);
  });

  overlay.querySelector('#closeProjModal').onclick = ()=>closeModal(overlay);
  overlay.querySelector('#cancelProjBtn').onclick = ()=>closeModal(overlay);
  overlay.onmousedown = (e)=>{ if(e.target===overlay) closeModal(overlay); };

  overlay.querySelector('#saveProjBtn').onclick = ()=>{
    const name = overlay.querySelector('#projNameInput').value.trim();
    if(!name){ shake(overlay.querySelector('#projNameInput')); return; }
    const notes = overlay.querySelector('#projNotesInput').value.trim();
    if(isNew){
      const p = {id:uid(), name, color:chosenColor, notes};
      state.projects.push(p);
      state.currentView = p.id;
      showToast('Progetto creato');
    } else {
      project.name = name;
      project.color = chosenColor;
      project.notes = notes;
      showToast('Progetto aggiornato');
    }
    scheduleSave();
    closeModal(overlay);
    render();
  };

  const delBtn = overlay.querySelector('#deleteProjBtn');
  if(delBtn){
    delBtn.onclick = ()=>{
      closeModal(overlay);
      openConfirmDelete('project', project.id, 'Eliminare "'+project.name+'"?', 'Verranno eliminate anche tutte le fasi collegate a questo progetto. L\u2019azione non e\u0300 reversibile.');
    };
  }

  document.getElementById('projNameInput').focus();
}

/* ===================== PHASE MODAL ===================== */
function openPhaseModal(phase, presetProjectId, presetStartISO){
  editingPhase = phase || null;
  const isNew = !phase;
  const today = todayISO();

  let projId = phase ? phase.projectId : (presetProjectId || (state.currentView!=='all' ? state.currentView : (state.projects[0] && state.projects[0].id)));
  let name = phase ? phase.name : '';
  let start = phase ? phase.start : (presetStartISO || today);
  let end = phase ? phase.end : toISO(addDays(fromISO(presetStartISO||today), 6));
  let isMilestone = phase ? !!phase.milestone : false;
  let notes = phase ? (phase.notes||'') : '';
  let customColor = phase ? (phase.color||'') : '';

  const overlay = document.createElement('div');
  overlay.className = 'overlay';
  overlay.innerHTML = `
    <div class="modal">
      <div class="modal-head">
        <h2>${isNew ? '+ NUOVA FASE' : 'MODIFICA FASE'}</h2>
        <button class="modal-close" id="closePhaseModal">\u2715</button>
      </div>

      <div class="field">
        <label>Progetto</label>
        <div class="proj-pick" id="projPick"></div>
      </div>

      <div class="field">
        <label>Nome fase</label>
        <input type="text" id="phaseNameInput" placeholder="es. Sviluppo core" value="${escapeHtml(name)}">
      </div>

      <div class="toggle-row">
        <span>&gt; Traguardo (senza durata)</span>
        <div class="switch ${isMilestone?'on':''}" id="milestoneSwitch"></div>
      </div>

      <div class="field-row">
        <div class="field">
          <label>Inizio</label>
          <input type="date" id="phaseStartInput" value="${start}">
        </div>
        <div class="field" id="endField">
          <label>Fine</label>
          <input type="date" id="phaseEndInput" value="${end}">
        </div>
      </div>

      <div class="field">
        <label>Colore (opzionale, altrimenti eredita dal progetto)</label>
        <div class="swatches" id="phaseSwatches"></div>
      </div>

      <div class="field">
        <label>Note (opzionale)</label>
        <textarea id="phaseNotesInput" placeholder="Dettagli, dipendenze, responsabili...">${escapeHtml(notes)}</textarea>
      </div>

      <div class="modal-actions">
        ${!isNew ? '<button class="btn danger icon-only" id="deletePhaseBtn" title="Elimina fase"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg></button>' : ''}
        <button class="btn ghost" id="cancelPhaseBtn">ANNULLA</button>
        <button class="btn cyan" id="savePhaseBtn">${isNew ? 'CREA' : 'SALVA'}</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);

  // project picker
  const pickWrap = overlay.querySelector('#projPick');
  if(state.projects.length === 0){
    pickWrap.innerHTML = '<span class="hint">Crea prima un progetto.</span>';
  } else {
    state.projects.forEach(p=>{
      const opt = document.createElement('div');
      opt.className = 'proj-pick-opt' + (p.id===projId ? ' active':'');
      opt.innerHTML = '<span class="proj-swatch" style="background:'+p.color+'; color:'+p.color+';"></span><span>'+escapeHtml(p.name)+'</span>';
      opt.onclick = ()=>{
        projId = p.id;
        pickWrap.querySelectorAll('.proj-pick-opt').forEach(o=>o.classList.remove('active'));
        opt.classList.add('active');
      };
      pickWrap.appendChild(opt);
    });
  }

  // milestone toggle
  const msSwitch = overlay.querySelector('#milestoneSwitch');
  const endField = overlay.querySelector('#endField');
  function syncMilestoneUI(){
    endField.style.display = isMilestone ? 'none' : 'block';
  }
  syncMilestoneUI();
  msSwitch.onclick = ()=>{
    isMilestone = !isMilestone;
    msSwitch.classList.toggle('on', isMilestone);
    syncMilestoneUI();
  };

  // color swatches (with "none / inherit" option)
  const phSwWrap = overlay.querySelector('#phaseSwatches');
  const noneSw = document.createElement('div');
  noneSw.className = 'swatch' + (customColor===''?' active':'');
  noneSw.style.background = 'transparent';
  noneSw.style.border = '2px dashed var(--border-blue)';
  noneSw.title = 'Eredita dal progetto';
  noneSw.onclick = ()=>{ customColor=''; refreshPhSw(); };
  phSwWrap.appendChild(noneSw);
  PALETTE.forEach(c=>{
    const sw = document.createElement('div');
    sw.className = 'swatch' + (c.hex===customColor?' active':'');
    sw.style.background = c.hex; sw.style.color = c.hex;
    sw.onclick = ()=>{ customColor = c.hex; refreshPhSw(); };
    phSwWrap.appendChild(sw);
  });
  function refreshPhSw(){
    phSwWrap.querySelectorAll('.swatch').forEach((el,i)=>{
      el.classList.toggle('active', (i===0 && customColor==='') || (i>0 && PALETTE[i-1].hex===customColor));
    });
  }

  overlay.querySelector('#closePhaseModal').onclick = ()=>closeModal(overlay);
  overlay.querySelector('#cancelPhaseBtn').onclick = ()=>closeModal(overlay);
  overlay.onmousedown = (e)=>{ if(e.target===overlay) closeModal(overlay); };

  overlay.querySelector('#savePhaseBtn').onclick = ()=>{
    const nameVal = overlay.querySelector('#phaseNameInput').value.trim();
    if(!nameVal){ shake(overlay.querySelector('#phaseNameInput')); return; }
    if(!projId){ showToast('Crea prima un progetto'); return; }
    let startVal = overlay.querySelector('#phaseStartInput').value || today;
    let endVal = isMilestone ? startVal : (overlay.querySelector('#phaseEndInput').value || startVal);
    if(fromISO(endVal) < fromISO(startVal)) endVal = startVal;
    const notesVal = overlay.querySelector('#phaseNotesInput').value.trim();

    if(isNew){
      const ph = {id:uid(), projectId:projId, name:nameVal, start:startVal, end:endVal, color:customColor, milestone:isMilestone, notes:notesVal};
      state.phases.push(ph);
      state.selectedId = ph.id;
      showToast('Fase creata');
    } else {
      phase.projectId = projId;
      phase.name = nameVal;
      phase.start = startVal;
      phase.end = endVal;
      phase.color = customColor;
      phase.milestone = isMilestone;
      phase.notes = notesVal;
      showToast('Fase aggiornata');
    }
    scheduleSave();
    closeModal(overlay);
    render();
  };

  const delBtn = overlay.querySelector('#deletePhaseBtn');
  if(delBtn){
    delBtn.onclick = ()=>{
      closeModal(overlay);
      openConfirmDelete('phase', phase.id, 'Eliminare la fase "'+phase.name+'"?', 'L\u2019azione non e\u0300 reversibile.');
    };
  }

  document.getElementById('phaseNameInput').focus();
}

function shake(el){
  el.style.borderColor = 'var(--danger)';
  el.animate([{transform:'translateX(0)'},{transform:'translateX(-4px)'},{transform:'translateX(4px)'},{transform:'translateX(0)'}], {duration:220});
  setTimeout(()=>{ el.style.borderColor=''; }, 900);
}

/* ===================== CONFIRM DELETE ===================== */
function openConfirmDelete(type, id, title, body){
  pendingDeleteType = type; pendingDeleteId = id;
  const overlay = document.createElement('div');
  overlay.className = 'overlay';
  overlay.innerHTML = `
    <div class="modal confirm">
      <div class="modal-head"><h2>[ CONFERMA ]</h2><button class="modal-close" id="closeConfirm">\u2715</button></div>
      <p><b style="color:var(--text-primary); font-weight:400;">${escapeHtml(title)}</b><br><br>${escapeHtml(body)}</p>
      <div class="modal-actions">
        <button class="btn ghost" id="cancelConfirm">ANNULLA</button>
        <button class="btn danger" id="confirmDeleteBtn">ELIMINA</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  overlay.querySelector('#closeConfirm').onclick = ()=>closeModal(overlay);
  overlay.querySelector('#cancelConfirm').onclick = ()=>closeModal(overlay);
  overlay.onmousedown = (e)=>{ if(e.target===overlay) closeModal(overlay); };
  overlay.querySelector('#confirmDeleteBtn').onclick = ()=>{
    if(pendingDeleteType === 'project'){
      state.phases = state.phases.filter(ph=>ph.projectId !== pendingDeleteId);
      state.projects = state.projects.filter(p=>p.id !== pendingDeleteId);
      if(state.currentView === pendingDeleteId) state.currentView = 'all';
      showToast('Progetto eliminato');
    } else {
      state.phases = state.phases.filter(ph=>ph.id !== pendingDeleteId);
      showToast('Fase eliminata');
    }
    scheduleSave();
    closeModal(overlay);
    render();
  };
}

function closeModal(overlay){
  overlay.remove();
}

/* ===================== EXPORT / IMPORT ===================== */
function exportBackup(){
  const payload = {projects:state.projects, phases:state.phases, exportedAt:new Date().toISOString()};
  const blob = new Blob([JSON.stringify(payload,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'nexus-timeline-backup-'+todayISO()+'.json';
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
  showToast('Backup esportato');
}

function importBackup(file){
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const data = JSON.parse(reader.result);
      if(!Array.isArray(data.projects) || !Array.isArray(data.phases)) throw new Error('formato non valido');
      state.projects = data.projects;
      state.phases = data.phases;
      state.currentView = 'all';
      scheduleSave();
      render();
      showToast('Backup importato');
    }catch(e){
      showToast('File non valido');
    }
  };
  reader.readAsText(file);
}

/* ===================== EVENTS ===================== */
function bindEvents(){
  document.getElementById('newProjectBtn').onclick = ()=>openProjectModal(null);
  document.getElementById('newPhaseBtn').onclick = ()=>{
    const preset = state.currentView !== 'all' ? state.currentView : null;
    openPhaseModal(null, preset);
  };
  document.getElementById('linkFileBtn').onclick = toggleFileLink;
  document.getElementById('syncIndicator').onclick = async ()=>{
    setSyncStatus('syncing', 'sincronizzazione...');
    await loadDataAndApply();
  };
  document.getElementById('emptyNewProjectBtn').onclick = ()=>openProjectModal(null);
  document.getElementById('todayBtn').onclick = scrollToToday;
  document.getElementById('exportBtn').onclick = exportBackup;
  document.getElementById('importBtn').onclick = ()=>document.getElementById('importFile').click();
  document.getElementById('importFile').onchange = (e)=>{
    if(e.target.files[0]) importBackup(e.target.files[0]);
    e.target.value = '';
  };
  document.getElementById('searchInput').oninput = (e)=>{ state.search = e.target.value; render(); };
  document.querySelectorAll('.zoom-btn').forEach(b=>{
    b.onclick = ()=>{ state.zoom = b.dataset.zoom; scheduleSave(); render(); setTimeout(scrollToToday, 30); };
  });
  document.addEventListener('keydown', (e)=>{
    if(e.key === 'Escape'){
      document.querySelectorAll('.overlay').forEach(o=>o.remove());
    }
  });
}

function scrollToToday(){
  const viewport = document.getElementById('viewport');
  const sidebarW = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--sidebar-w'));
  const range = computeRange();
  const offsetDays = daysBetween(range.start, strip(new Date()));
  const targetX = Math.max(0, offsetDays*pxPerDay - (viewport.clientWidth - sidebarW)/2);
  viewport.scrollTo({left: targetX, top: viewport.scrollTop, behavior:'smooth'});
}

/* ===================== INIT ===================== */
async function loadDataAndApply(){
  const loaded = await loadData();
  if(loaded){
    state.projects = loaded.projects || [];
    state.phases = loaded.phases || [];
    state.collapsed = loaded.collapsed || {};
    state.zoom = loaded.zoom || 'month';
    render();
    return true;
  }
  return false;
}

async function init(){
  const ok = await loadDataAndApply();
  if(!ok && !REMOTE_URL){
    seedIfEmpty();
    await saveData();
  }
  document.getElementById('loadingWrap').style.display = 'none';
  document.getElementById('app').style.display = 'flex';
  bindEvents();
  setLinkedLabel(null);
  render();
  setTimeout(scrollToToday, 60);
  startPolling();
}

init();

})();
